name: Consume published LocalCloud action
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/assert-cleanup
      - id: cloud
        uses: cloud-orbitor/setup-localcloud@de6d236db036be4c8b96879392d22a1feb5047c6 # v0.1.0
        with:
          services: gcs,pubsub,bigquery
      - run: pip install -r examples/requirements.txt
      - run: python examples/python-smoke.py
      - name: Record owned resources for automatic post verification
        if: always() && steps.cloud.outputs.container-id != ''
        env:
          LOCALCLOUD_CONTAINER_ID: ${{ steps.cloud.outputs.container-id }}
        run: node .github/check-cleanup.mjs
